contents:
  - title: About Me
    description: "DAMA-Certified Data Management Professional (CDMP, Practitioner) who owns what an organization's numbers mean and makes that enforceable in the systems that serve them. Built and led data governance functions from the ground up across two organizations, establishing metric definitions, semantic layer strategy, and data quality standards where none existed. Builds Snowflake semantic layers and the AI agents on top of them, and evaluates agent output against approved business logic. Effective communicator skilled at resolving conflicting metric definitions across stakeholders and translating technical concepts for any audience."
