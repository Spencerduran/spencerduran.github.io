subject: Experience
listing-order: 2
icon: "/assets/img/briefcase.svg"
contents:
  - title: Monster Lead Group
    role: Manager of Data Governance
    description:
      - Built the data governance function from the ground up as its first dedicated owner, establishing metric definitions and reporting standards where none existed, including a rapid evaluation of Denodo as a candidate semantic layer platform.
      - Designed and led a 12-week business glossary standardization program, publishing ~90 governed term definitions across marketing, mortgage, and data domains, each tied to a formula, unit, and its exact source-of-truth Snowflake field through a triage-to-publish workflow - SME review, monthly steering committee, quarterly audit.
      - Evaluated and retired an AWS Glue/QuickSight proof-of-concept, then rebuilt enterprise reporting on Snowflake semantic views. Stood up the underlying views plus the access roles and grants governing them, converted business calculation logic into governed definitions, and built the AI agents on top (segmentation, campaign, sentiment, loan satisfaction) so agent output reflects approved logic.
      - Authored end-to-end documentation of the company's core data architecture - a 10-stage Dagster-orchestrated production ETL, field-level lineage for high-stakes attributes, and a Snowflake → dbt → Iceberg pipeline ingesting data from 11 external lender clients. Also documented vendor evaluations for an AI-powered call intelligence pipeline.
      - Built the "FishFinder" lead-scoring model into a Cortex AI agent and validated it with a real point-in-time backtest, confirming the model generates a genuine predictive signal.
    date: Sept. 2024 - Ongoing
  - title: Navy Mutual Aid Association
    role: Enterprise Data Steward
    description:
      - Led delivery of a new enterprise data lake house, integrating legacy and SaaS systems, building data dictionaries, and overseeing data modeling and mastering across the platform.
      - Led joint data and business governance meetings to establish clear metric definitions, implemented a Power User program to build a stewardship culture, and directed KPI dashboard development and monthly Steering Committee reporting reviews.
      - Delivered training and data analysis support organization-wide, including interviewing and hiring new Business Intelligence Analysts.
    date: Aug. 2022 - Sept. 2024
  - title: Rocket Homes
    role: Senior Technical Data Steward
    description:
      - Led onboarding of real estate data feeds (MLS, VOW, IDX) from all 50 states across major vendor APIs (CoreLogic Trestle, Black Knight, MLS Grid, Zillow Bridge, FlexMLS).
      - Built mapping and normalization pipelines for hundreds of data feeds, automated tooling for metadata and sample-data retrieval, and standardized enterprise technical and business metadata.
      - Established enterprise data quality standards (Completeness, Timeliness, Consistency, Validity, Accuracy), built custom data quality and profiling rules, and validated governance materials for technical accuracy.
    date: March 2018 - Aug. 2022
